<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>车机手机位置状态预览</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111920;color:#edf3f6}body{max-width:720px;margin:48px auto;padding:20px}h1{font-size:24px}p{color:#aebac4;line-height:1.6}select{min-height:48px;font:inherit;padding:8px;margin:0 0 20px 12px}.screen{position:relative;width:536px;max-width:100%;height:240px;background:linear-gradient(125deg,#1e2f38,#071016);overflow:hidden;border-radius:16px}.road{position:absolute;left:120px;bottom:-60px;width:200px;height:260px;border:2px solid #7c8b92;transform:perspective(300px) rotateX(50deg)}.card{position:absolute;right:76px;top:16px;box-sizing:border-box;min-width:216px;min-height:50px;padding:11px 8px 11px 59px;border-radius:14px;background:rgba(7,13,18,.88);font-weight:700;white-space:nowrap;font-size:23px}.card:before{content:'↰';position:absolute;left:8px;top:4px;font-size:36px;color:#9be6b9}.card.lost{color:#d25a5a}.card.lost:before{content:'↥̸';color:#5c6870}.eta{font-size:18px;margin-top:9px;color:#a2afb9}.hidden{display:none}footer{font-size:13px;margin-top:24px;color:#aebac4}
</style>
<h1>车机导航卡：手机位置状态</h1>
<p>状态文案预览。定位失效时保留短卡，隐藏旧转向距离与预计到达时间。</p>
<label for="state">预览状态</label><select id="state"><option value="lost">手机精确定位不可用</option><option value="navigating">导航中</option><option value="rerouting">重新规划</option></select>
<div class="screen" aria-label="536 × 240 车机布局示意"><div class="road"></div><article class="card lost" aria-live="polite"><span id="phrase">Phone location unavailable</span><div class="eta hidden" id="eta">12 min　8.4 km</div></article></div>
<footer>这是一页可运行的 HTML 文案示意，使用系统字体；实际车机使用 Inter，仍需设备验证。未截图、未读取图像。</footer>
<script>
const states={lost:'Phone location unavailable',navigating:'350 m',rerouting:'Rerouting'};
function showState(state){document.querySelector('.card').classList.toggle('lost',state==='lost');document.querySelector('#phrase').textContent=states[state];document.querySelector('#eta').classList.toggle('hidden',state!=='navigating');}
document.querySelector('#state').addEventListener('change',event=>showState(event.target.value));
console.assert(states.lost==='Phone location unavailable' && Object.keys(states).length===3);
</script>
</html>
